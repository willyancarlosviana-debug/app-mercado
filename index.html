<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Mercado</title>
<meta name="theme-color" content="#1C9A6C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --ground: #F4F3FA;
    --surface: rgba(255,255,255,0.72);
    --surface-2: rgba(23,21,31,0.04);
    --line: rgba(23,21,31,0.09);
    --ink: #17151F;
    --ink-soft: #6B6780;
    --accent: #1C9A6C;
    --accent-soft: #E0F3EA;
    --warn: #D8503A;
    --warn-soft: #FBE7E2;
    --shadow: 0 1px 2px rgba(23,21,31,0.05), 0 10px 28px rgba(23,21,31,0.08);
    --blur: blur(16px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #100F16;
      --surface: rgba(255,255,255,0.055);
      --surface-2: rgba(255,255,255,0.03);
      --line: rgba(255,255,255,0.08);
      --ink: #F2F0FA;
      --ink-soft: #8B87A0;
      --accent: #7AE0B4;
      --accent-soft: rgba(122,224,180,0.14);
      --warn: #FF8C78;
      --warn-soft: rgba(255,140,120,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --ground: #100F16;
    --surface: rgba(255,255,255,0.055);
    --surface-2: rgba(255,255,255,0.03);
    --line: rgba(255,255,255,0.08);
    --ink: #F2F0FA;
    --ink-soft: #8B87A0;
    --accent: #7AE0B4;
    --accent-soft: rgba(122,224,180,0.14);
    --warn: #FF8C78;
    --warn-soft: rgba(255,140,120,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 0.35rem;
  }
  h1 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 1.75rem;
    text-wrap: balance;
  }

  .sync-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    white-space: nowrap;
    margin-top: 0.15rem;
  }
  .sync-indicator .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: background 0.2s ease;
  }
  .sync-indicator.live .dot { background: var(--accent); }
  .sync-indicator.saving .dot { background: #C9962B; }
  .sync-indicator.off .dot { background: var(--warn); }

  .top-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .theme-toggle {
    width: 2rem;
    height: 2rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 16px; height: 16px; }

  .reset-btn {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    height: 2rem;
    padding: 0 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .reset-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .reset-btn:hover { border-color: var(--warn); color: var(--warn); }
  .reset-btn.accent-hover:hover { border-color: var(--accent); color: var(--accent); }
  .reset-btn.accent-tint { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #resetBtn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

  @media (max-width: 480px) {
    .reset-btn span.reset-label { display: none; }
  }

  /* Budget panel */
  .budget-panel {
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 480px) {
    .budget-panel { grid-template-columns: 1fr; }
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .money-input {
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    border-bottom: 2px solid var(--line);
    padding-bottom: 0.3rem;
    transition: border-color 0.15s ease;
  }
  .money-input:focus-within { border-color: var(--accent); }
  .money-input span {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 1.1rem;
  }
  .money-input input {
    border: none;
    background: transparent;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .balance-value {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    font-weight: 600;
    padding-bottom: 0.3rem;
    border-bottom: 2px solid transparent;
  }
  .balance-value.ok { color: var(--accent); }
  .balance-value.over { color: var(--warn); }

  /* Status strip */
  .status-strip {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 1.25rem;
    padding: 0 0.1rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
  }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }
  .pill.over { background: var(--warn-soft); color: var(--warn); }
  .pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-strip .bar {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .status-strip .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .status-strip .bar-fill.over { background: var(--warn); }

  /* Search */
  .search-bar {
    position: relative;
    margin-bottom: 0.9rem;
  }
  .search-bar input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.65rem 2.4rem 0.65rem 2.4rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--ink-soft); }
  .search-bar .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  .search-bar .clear-search {
    position: absolute;
    right: 0.4rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.7rem;
    height: 1.7rem;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 999px;
    font-size: 1.1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .search-bar .clear-search:hover { background: var(--surface-2); color: var(--warn); }

  .item-category-tag {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 0.15rem;
  }

  /* Category tabs */
  .category-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.9rem;
  }
  .category-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.2rem;
    padding: 0.65rem 0.85rem;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: left;
    min-width: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .category-tab:hover { border-color: var(--accent); }
  .category-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .category-tab .tab-name {
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .category-tab .tab-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  .category-tab.active .tab-sub { color: var(--accent); }

  @media (max-width: 520px) {
    .category-tab .tab-name { font-size: 0.74rem; }
    .category-tab .tab-sub { font-size: 0.66rem; }
  }

  /* List */
  .list-card {
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .list-head {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--surface-2);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .list-head .num { text-align: right; }
  #rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    grid-template-areas: "name qty unit total remove";
    gap: 0.5rem;
    align-items: center;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--line);
    background: transparent;
    transition: background-color 0.2s ease;
  }
  .row.priced {
    background: var(--accent-soft);
  }
  .row .name-cell {
    grid-area: name;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .row .qty-field { grid-area: qty; }
  .row .unit-field { grid-area: unit; }
  .row .line-total { grid-area: total; }
  .row .remove { grid-area: remove; }

  .row input[type="text"] {
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    padding: 0.3rem 0;
    width: 100%;
    min-width: 0;
  }
  .row input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.6; }
  .row input[type="number"] {
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    outline: none;
    padding: 0.25rem 0.1rem;
    width: 100%;
    text-align: right;
    min-width: 0;
  }
  .row input[type="number"]:focus { border-color: var(--accent); }
  .field-label {
    display: none;
  }
  .row .line-total {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.92rem;
    font-weight: 600;
    text-align: right;
  }
  .row .remove {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0.2rem;
    border-radius: 6px;
    justify-self: end;
  }
  .row .remove:hover { color: var(--warn); background: var(--warn-soft); }

  .empty-state {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    border-top: 1px solid var(--line);
  }

  .add-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .add-row button {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px dashed var(--line);
    background: var(--surface);
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .add-row button:hover { border-color: var(--accent); background: var(--accent-soft); }

  .list-foot {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .list-foot .label {
    grid-column: 1 / 4;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .list-foot .total {
    text-align: right;
    font-weight: 700;
    font-size: 1rem;
  }

  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .hint {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: center;
  }

  .site-footer {
    margin-top: 2.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }

  /* Planejar compra */
  .planning-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .planning-header h2 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0.2rem 0 0;
    letter-spacing: -0.01em;
  }
  .planning-counter {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .plan-category { margin-bottom: 1.25rem; }
  .plan-category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.5rem;
    gap: 0.75rem;
  }
  .plan-category-head .name {
    font-weight: 600;
    font-size: 0.88rem;
  }
  .plan-category-head .bulk-actions {
    display: flex;
    gap: 0.75rem;
    flex-shrink: 0;
  }
  .plan-category-head .bulk-actions button {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .plan-category-head .mark-all { color: var(--accent); }
  .plan-category-head .unmark-all { color: var(--ink-soft); }

  .plan-list {
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .plan-row {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.6rem 0.9rem;
    border-top: 1px solid var(--line);
    font-size: 0.92rem;
    cursor: pointer;
  }
  .plan-row:first-child { border-top: none; }
  .plan-row input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .plan-add-row {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .plan-add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.4rem 0.6rem;
    background: var(--surface);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    outline: none;
  }
  .plan-add-row input[type="text"]:focus { border-color: var(--accent); }
  .plan-add-row button {
    border: 1px dashed var(--line);
    background: var(--surface);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.8rem;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .plan-add-row button:hover { border-color: var(--accent); background: var(--accent-soft); }

  .planning-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 0.6rem;
    margin-top: 0.5rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--line);
    background: var(--ground);
  }
  .planning-footer button {
    padding: 0.7rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .planning-footer .cancel-plan {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
  }
  .planning-footer .go-shopping {
    flex: 2;
    border: none;
    background: var(--accent);
    color: #fff;
  }
  .planning-footer .go-shopping:hover { filter: brightness(0.93); }

  /* Histórico */
  .history-back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 1.25rem;
  }
  .history-back:hover { border-color: var(--accent); color: var(--accent); }

  .history-entry {
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 0.85rem;
    overflow: hidden;
  }
  .history-entry summary {
    list-style: none;
    cursor: pointer;
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .history-entry summary::-webkit-details-marker { display: none; }
  .history-entry summary .date {
    font-weight: 600;
    font-size: 0.9rem;
  }
  .history-entry summary .date .budget-note {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }
  .history-entry summary .total {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    flex-shrink: 0;
  }
  .history-body {
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--line);
  }
  .history-cat { margin-top: 0.85rem; }
  .history-cat .name {
    font-weight: 600;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
  }
  .history-item-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.3rem 0;
    font-size: 0.85rem;
    border-top: 1px solid var(--line);
  }
  .history-item-row:first-of-type { border-top: none; }
  .history-item-row .qty {
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    margin-left: 0.4rem;
  }
  .history-item-row .price {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  @media (max-width: 560px) {
    .list-head { display: none; }

    .row {
      grid-template-columns: 1fr 1fr 1fr auto;
      grid-template-areas:
        "name name name remove"
        "qty  unit  total total";
      row-gap: 0.6rem;
      column-gap: 0.6rem;
      padding: 0.75rem 1rem;
    }
    .row .name-input {
      font-size: 1rem;
      font-weight: 500;
    }
    .row .remove { align-self: start; }
    .row .line-total {
      align-self: center;
      font-size: 1rem;
    }
    .field-label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
      margin-bottom: 0.2rem;
    }

    .list-foot {
      grid-template-columns: 1fr auto;
    }
    .list-foot .label { grid-column: auto; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="top-row">
    <div>
      <p class="eyebrow">Controle de compras</p>
      <h1>Lista de Mercado</h1>
    </div>
    <div class="top-actions">
      <button class="reset-btn accent-hover" id="historyBtn" type="button" title="Ver compras já finalizadas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span class="reset-label">Histórico</span>
      </button>
      <button class="reset-btn accent-hover" id="planBtn" type="button" title="Escolher quais itens entram nesta compra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="reset-label">Planejar compra</span>
      </button>
      <button class="reset-btn accent-tint" id="finalizeBtn" type="button" title="Guardar esta compra no histórico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="reset-label">Finalizar compra</span>
      </button>
      <button class="reset-btn" id="resetBtn" type="button" title="Zerar quantidades, valores e saldo para uma nova compra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span class="reset-label">Nova lista</span>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema"></button>
      <span class="sync-indicator off" id="syncIndicator"><span class="dot"></span><span id="syncLabel">conectando…</span></span>
    </div>
  </div>

  <div id="shoppingView">
    <div class="budget-panel">
      <div class="field">
        <label for="budget">Saldo para compra</label>
        <div class="money-input">
          <span>R$</span>
          <input type="number" id="budget" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
        </div>
      </div>
      <div class="field">
        <label>Saldo restante</label>
        <div class="balance-value ok" id="balanceValue">R$ 0,00</div>
      </div>
    </div>

    <div class="status-strip">
      <span class="pill ok" id="statusPill">dentro do saldo</span>
      <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
      <span id="statusPct">0%</span>
    </div>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Buscar item em todas as abas..." autocomplete="off">
      <button type="button" class="clear-search" id="clearSearchBtn" aria-label="Limpar busca" title="Limpar busca" style="display:none">×</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="list-card">
      <div class="list-head">
        <span>Item</span>
        <span class="num">Qtd.</span>
        <span class="num">Unit.</span>
        <span class="num">Total</span>
        <span></span>
      </div>
      <div id="rows"></div>
      <div class="add-row" id="addRow">
        <button id="addBtn" type="button">+ adicionar item</button>
      </div>
      <div class="list-foot">
        <span class="label" id="footLabel">Subtotal nesta aba</span>
        <span class="total" id="cartTotal">R$ 0,00</span>
        <span></span>
      </div>
    </div>
  </div>

  <div class="planning-view" id="planningView" style="display:none;"></div>

  <div class="history-view" id="historyView" style="display:none;"></div>

  <p class="site-footer">© <span id="footerYear"></span> Willyan Viana</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://rheujziajqjcezvvpfno.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_YSFqv-uAUtarAb1RUzLYBw_ftTjVxfG';
  var ROW_ID = 'default';
  var CATEGORIES = ['Frutas e Verduras', 'Carnes', 'Limpeza', 'Cereais e Mercearia'];

  // Se o CDN do supabase-js não carregou (ex: primeira visita offline), o app
  // continua funcionando só com o cache local em vez de travar.
  var supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  var realtimeConnected = false;
  var dirty = false;
  var LOCAL_CACHE_KEY = 'lista-mercado-cache-v1';

  var rowsEl = document.getElementById('rows');
  var budgetInput = document.getElementById('budget');
  var balanceValue = document.getElementById('balanceValue');
  var cartTotal = document.getElementById('cartTotal');
  var footLabel = document.getElementById('footLabel');
  var statusPill = document.getElementById('statusPill');
  var statusPct = document.getElementById('statusPct');
  var barFill = document.getElementById('barFill');
  var addBtn = document.getElementById('addBtn');
  var syncIndicator = document.getElementById('syncIndicator');
  var syncLabel = document.getElementById('syncLabel');
  var categoryTabsEl = document.getElementById('categoryTabs');
  var themeToggle = document.getElementById('themeToggle');
  var resetBtn = document.getElementById('resetBtn');
  var searchInput = document.getElementById('searchInput');
  var clearSearchBtn = document.getElementById('clearSearchBtn');
  var addRowEl = document.getElementById('addRow');

  var THEME_KEY = 'lista-mercado-theme';
  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function effectiveTheme() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function refreshThemeIcon() {
    // O ícone mostra o tema para o qual o clique vai mudar.
    themeToggle.innerHTML = effectiveTheme() === 'dark' ? SUN_ICON : MOON_ICON;
  }

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    refreshThemeIcon();
  }

  (function initTheme() {
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(stored);
  })();

  themeToggle.addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  var footerYearEl = document.getElementById('footerYear');
  if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();

  function mkItems(names) {
    return names.map(function (name) { return { name: name, qty: 1, price: 0, included: true }; });
  }

  function defaultItemsByCategory() {
    var data = {
      'Frutas e Verduras': mkItems(['Cebola', 'Alho', 'Milho', 'Maçã', 'Banana']),
      'Carnes': mkItems(['Salsicha', 'Frango', 'Sardinha']),
      'Limpeza': mkItems([
        'Sabão em pó', 'Sabão', 'Pinho Sol', 'Amaciante', 'Absorvente', 'Sabonetes',
        'Pasta de dente', 'Papel higiênico', 'Papel toalha', 'Desodorante gel',
        'Sabonete/sabão umedecidos', 'Bom Bril', 'Pano de pia'
      ]),
      'Cereais e Mercearia': mkItems([
        'Farinha', 'Feijão', 'Açúcar', 'Café', 'Leite - fardos', 'Leite condensado',
        'Creme de leite', 'Biscoitos', 'Iogurtes', 'Extrato de tomate', 'Macarrão/Massa',
        'Margarina', 'Fermento pão', 'Requeijão', 'Óleo', 'Refil coador'
      ])
    };
    CATEGORIES.forEach(function (cat) { sortItems(data[cat]); });
    return data;
  }

  var state = { budget: 0, itemsByCategory: defaultItemsByCategory() };
  var activeCategory = CATEGORIES[0];
  var searchQuery = '';
  var lastSentJson = null;
  var saveTimer = null;

  function setSync(mode, label) {
    syncIndicator.className = 'sync-indicator ' + mode;
    syncLabel.textContent = label;
  }

  function formatBRL(n) {
    if (!isFinite(n)) n = 0;
    return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Garante que todas as categorias existam, mesmo em dados antigos/incompletos.
  function normalizeItems(raw) {
    var result = {};
    CATEGORIES.forEach(function (cat) {
      if (raw && Array.isArray(raw[cat])) {
        result[cat] = raw[cat];
      } else {
        result[cat] = [];
      }
    });
    // Formato antigo (lista única, sem categorias, ou categoria "Cereais" renomeada): joga tudo em Cereais e Mercearia.
    if (raw && Array.isArray(raw) && raw.length) {
      result['Cereais e Mercearia'] = result['Cereais e Mercearia'].concat(raw);
    }
    if (raw && Array.isArray(raw['Cereais']) && raw['Cereais'].length) {
      result['Cereais e Mercearia'] = result['Cereais e Mercearia'].concat(raw['Cereais']);
    }
    CATEGORIES.forEach(function (cat) { sortItems(result[cat]); });
    return result;
  }

  function sortItems(list) {
    list.sort(function (a, b) {
      return (a.name || '').localeCompare(b.name || '', 'pt-BR', { sensitivity: 'base', numeric: true });
    });
  }

  // Espelha o estado atual no aparelho, pra abrir instantaneamente (e funcionar
  // offline) mesmo sem esperar resposta do Supabase.
  function saveLocalCache() {
    try {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({
        budget: state.budget,
        itemsByCategory: state.itemsByCategory
      }));
    } catch (e) { /* ignore */ }
  }

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.itemsByCategory) return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function categoryTotal(cat) {
    var items = state.itemsByCategory[cat] || [];
    return items.reduce(function (sum, item) {
      if (item.included === false) return sum;
      return sum + (Number(item.qty) || 0) * (Number(item.price) || 0);
    }, 0);
  }

  function grandTotal() {
    return CATEGORIES.reduce(function (sum, cat) { return sum + categoryTotal(cat); }, 0);
  }

  function renderTabs() {
    categoryTabsEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-tab' + (cat === activeCategory ? ' active' : '');
      btn.innerHTML =
        '<span class="tab-name">' + escapeHtml(cat) + '</span>' +
        '<span class="tab-sub">' + formatBRL(categoryTotal(cat)) + '</span>';
      btn.addEventListener('click', function () {
        activeCategory = cat;
        render();
      });
      categoryTabsEl.appendChild(btn);
    });
  }

  function currentQuery() {
    return searchQuery.trim().toLowerCase();
  }

  // Em busca: junta itens de todas as categorias que casam com o texto.
  // Sem busca: só os itens da aba ativa. Cada entrada carrega sua categoria e índice
  // originais, para editar/remover o item certo mesmo em resultados combinados.
  function currentEntries(query) {
    if (query) {
      var out = [];
      CATEGORIES.forEach(function (cat) {
        (state.itemsByCategory[cat] || []).forEach(function (item, idx) {
          if (item.included === false) return;
          if ((item.name || '').toLowerCase().indexOf(query) !== -1) {
            out.push({ item: item, cat: cat, idx: idx });
          }
        });
      });
      return out;
    }
    return (state.itemsByCategory[activeCategory] || [])
      .map(function (item, idx) { return { item: item, cat: activeCategory, idx: idx }; })
      .filter(function (entry) { return entry.item.included !== false; });
  }

  function render() {
    var query = currentQuery();
    categoryTabsEl.style.display = query ? 'none' : '';
    addRowEl.style.display = query ? 'none' : '';
    if (!query) renderTabs();

    if (document.activeElement !== budgetInput) {
      budgetInput.value = state.budget ? state.budget : '';
    }
    rowsEl.innerHTML = '';

    var entries = currentEntries(query);

    if (!entries.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var hasAnyInCategory = (state.itemsByCategory[activeCategory] || []).length > 0;
      empty.textContent = query
        ? 'Nenhum item encontrado para "' + searchQuery.trim() + '".'
        : hasAnyInCategory
          ? 'Nenhum item incluído nesta aba. Toque em "Planejar compra" para escolher os itens desta compra.'
          : 'Nenhum item em "' + activeCategory + '" ainda.';
      rowsEl.appendChild(empty);
    }

    entries.forEach(function (entry) {
      var item = entry.item;
      var list = state.itemsByCategory[entry.cat];
      var idx = entry.idx;
      var row = document.createElement('div');
      var lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
      row.className = 'row' + (Number(item.price) > 0 ? ' priced' : '');
      row.innerHTML =
        '<div class="name-cell">' +
          (query ? '<span class="item-category-tag">' + escapeHtml(entry.cat) + '</span>' : '') +
          '<input type="text" class="name-input" placeholder="Nome do item" value="' + escapeHtml(item.name || '') + '">' +
        '</div>' +
        '<div class="qty-field"><span class="field-label">Qtd.</span><input type="number" class="qty-input" min="0" step="1" inputmode="numeric" value="' + (item.qty !== '' && item.qty !== undefined ? item.qty : '') + '"></div>' +
        '<div class="unit-field"><span class="field-label">Unit.</span><input type="number" class="price-input" min="0" step="0.01" inputmode="decimal" value="' + (item.price !== '' && item.price !== undefined ? item.price : '') + '"></div>' +
        '<span class="line-total">' + formatBRL(lineTotal) + '</span>' +
        '<button type="button" class="remove" aria-label="Remover item" title="Remover item">×</button>';

      row.querySelector('.name-input').addEventListener('input', function (e) {
        list[idx].name = e.target.value;
        scheduleSave();
      });
      row.querySelector('.name-input').addEventListener('blur', function () {
        // Reordena por ordem alfabética só ao terminar de editar o nome, para não
        // "fugir" da posição do cursor enquanto a pessoa ainda está digitando.
        sortItems(list);
        render();
      });
      row.querySelector('.qty-input').addEventListener('input', function (e) {
        list[idx].qty = e.target.value;
        scheduleSave();
        renderTotalsOnly();
      });
      row.querySelector('.price-input').addEventListener('input', function (e) {
        list[idx].price = e.target.value;
        scheduleSave();
        renderTotalsOnly();
      });
      row.querySelector('.remove').addEventListener('click', function () {
        list.splice(idx, 1);
        scheduleSave();
        render();
      });

      rowsEl.appendChild(row);
    });

    updateBalance();
    updateFooter(query, entries);
  }

  // Recalcula só os totais/rótulos sem recriar os inputs, para não perder o foco ao digitar.
  function renderTotalsOnly() {
    var query = currentQuery();
    var entries = currentEntries(query);
    var rowEls = rowsEl.querySelectorAll('.row');
    entries.forEach(function (entry, i) {
      var lineTotal = (Number(entry.item.qty) || 0) * (Number(entry.item.price) || 0);
      var rowEl = rowEls[i];
      if (!rowEl) return;
      var totalEl = rowEl.querySelector('.line-total');
      if (totalEl) totalEl.textContent = formatBRL(lineTotal);
      rowEl.classList.toggle('priced', Number(entry.item.price) > 0);
    });
    if (!query) renderTabs();
    updateBalance();
    updateFooter(query, entries);
  }

  function updateBalance() {
    var total = grandTotal();
    var budget = Number(state.budget) || 0;
    var remaining = budget - total;
    var over = remaining < 0;

    balanceValue.textContent = formatBRL(remaining);
    balanceValue.className = 'balance-value ' + (over ? 'over' : 'ok');

    statusPill.className = 'pill ' + (over ? 'over' : 'ok');
    statusPill.textContent = over ? 'saldo estourado' : 'dentro do saldo';

    var pct = budget > 0 ? Math.min(100, (total / budget) * 100) : (total > 0 ? 100 : 0);
    barFill.style.width = pct + '%';
    barFill.className = 'bar-fill' + (over ? ' over' : '');
    statusPct.textContent = Math.round(budget > 0 ? (total / budget) * 100 : 0) + '%';
  }

  function updateFooter(query, entries) {
    if (query) {
      var sum = entries.reduce(function (s, e) {
        return s + (Number(e.item.qty) || 0) * (Number(e.item.price) || 0);
      }, 0);
      footLabel.textContent = entries.length + (entries.length === 1 ? ' resultado' : ' resultados');
      cartTotal.textContent = formatBRL(sum);
    } else {
      footLabel.textContent = 'Subtotal — ' + activeCategory;
      cartTotal.textContent = formatBRL(categoryTotal(activeCategory));
    }
  }

  function scheduleSave() {
    saveLocalCache();
    dirty = true;
    if (!supabase) {
      setSync('saving', 'offline — editando localmente');
      return;
    }
    setSync('saving', 'salvando…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 450);
  }

  // Espelha o que normalizeItems() vai produzir quando o eco desta gravação
  // voltar pelo realtime, sem reordenar a lista de verdade enquanto a pessoa
  // ainda pode estar digitando um nome.
  function sortedSnapshot(itemsByCategory) {
    var snap = {};
    CATEGORIES.forEach(function (cat) {
      var copy = (itemsByCategory[cat] || []).slice();
      sortItems(copy);
      snap[cat] = copy;
    });
    return snap;
  }

  function persist() {
    saveLocalCache();
    if (!supabase) {
      dirty = true;
      setSync('saving', 'offline — editando localmente');
      return;
    }
    var payload = {
      id: ROW_ID,
      budget: Number(state.budget) || 0,
      items: state.itemsByCategory,
      updated_at: new Date().toISOString()
    };
    lastSentJson = JSON.stringify({ budget: payload.budget, items: sortedSnapshot(payload.items) });
    supabase.from('mercado_state').upsert(payload).then(function (res) {
      if (res.error) {
        dirty = true;
        setSync('saving', 'offline — editando localmente');
      } else {
        dirty = false;
        setSync('live', 'sincronizado');
      }
    }).catch(function () {
      dirty = true;
      setSync('saving', 'offline — editando localmente');
    });
  }

  // Reforça a reconexão além do evento 'online' (que falha com frequência no
  // iOS): enquanto houver algo pendente, tenta de novo a cada ~20s.
  var reconnectTimer = null;
  function ensureReconnectWatch() {
    if (reconnectTimer) return;
    reconnectTimer = setInterval(function () {
      if (dirty || hasPendingHistory()) tryReconnectAndFlush();
    }, 20000);
  }

  function tryReconnectAndFlush() {
    if (!supabase) return;
    if (!realtimeConnected) connectRealtime();
    if (dirty) persist();
    if (hasPendingHistory()) flushHistoryQueue();
  }

  // Fila de compras "finalizadas" enquanto offline — reaproveita a mesma
  // ideia de fila/reconexão já usada pra lista principal (dirty/persist).
  var HISTORY_QUEUE_KEY = 'lista-mercado-history-queue-v1';

  function loadHistoryQueue() {
    try {
      var raw = localStorage.getItem(HISTORY_QUEUE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistoryQueueList(list) {
    try { localStorage.setItem(HISTORY_QUEUE_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
  }

  function hasPendingHistory() {
    return loadHistoryQueue().length > 0;
  }

  function queueHistorySnapshot(snapshot) {
    var list = loadHistoryQueue();
    list.push(snapshot);
    saveHistoryQueueList(list);
  }

  function flushHistoryQueue() {
    if (!supabase) return;
    var list = loadHistoryQueue();
    if (!list.length) return;
    supabase.from('mercado_history').insert(list).then(function (res) {
      if (!res.error) saveHistoryQueueList([]);
    }).catch(function () { /* tenta de novo na próxima checagem */ });
  }

  window.addEventListener('online', tryReconnectAndFlush);
  window.addEventListener('offline', function () {
    setSync('saving', 'offline — editando localmente');
  });
  ensureReconnectWatch();

  budgetInput.addEventListener('input', function (e) {
    state.budget = e.target.value;
    scheduleSave();
    updateBalance();
  });

  searchInput.addEventListener('input', function (e) {
    searchQuery = e.target.value;
    clearSearchBtn.style.display = searchQuery ? 'flex' : 'none';
    render();
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && searchQuery) {
      searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      render();
    }
  });
  clearSearchBtn.addEventListener('click', function () {
    searchQuery = '';
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';
    searchInput.focus();
    render();
  });

  addBtn.addEventListener('click', function () {
    state.itemsByCategory[activeCategory].push({ name: '', qty: 1, price: 0, included: true });
    scheduleSave();
    render();
    var inputs = rowsEl.querySelectorAll('.name-input');
    var last = inputs[inputs.length - 1];
    if (last) last.focus();
  });

  resetBtn.addEventListener('click', function () {
    var ok = window.confirm(
      'Zerar quantidade, valor e saldo para começar uma nova compra?\n\n' +
      'Os nomes dos itens de cada aba continuam os mesmos, mas você vai escolher de novo quais entram ' +
      'nesta lista na tela de planejamento. Isso afeta o app de quem mais estiver com ele aberto.\n\n' +
      'Se quiser guardar a compra atual no histórico, use "Finalizar compra" antes de zerar.'
    );
    if (!ok) return;

    state.budget = 0;
    CATEGORIES.forEach(function (cat) {
      (state.itemsByCategory[cat] || []).forEach(function (item) {
        item.qty = 1;
        item.price = 0;
        item.included = false;
      });
    });
    searchQuery = '';
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';

    render();
    persist();
    openPlanning();
  });

  var planBtn = document.getElementById('planBtn');
  var shoppingViewEl = document.getElementById('shoppingView');
  var planningViewEl = document.getElementById('planningView');
  var planningDraft = null;

  function cloneItemsByCategory(src) {
    var out = {};
    CATEGORIES.forEach(function (cat) {
      out[cat] = (src[cat] || []).map(function (item) {
        return { name: item.name, qty: item.qty, price: item.price, included: item.included !== false };
      });
    });
    return out;
  }

  function openPlanning() {
    planningDraft = cloneItemsByCategory(state.itemsByCategory);
    shoppingViewEl.style.display = 'none';
    planningViewEl.style.display = '';
    renderPlanningView();
  }

  function closePlanning() {
    planningDraft = null;
    planningViewEl.style.display = 'none';
    shoppingViewEl.style.display = '';
  }

  // Histórico: "Finalizar compra" guarda um retrato da compra atual (sem
  // mexer na lista ativa); a aba "Histórico" só lê o que já foi guardado.
  var historyBtn = document.getElementById('historyBtn');
  var finalizeBtn = document.getElementById('finalizeBtn');
  var historyViewEl = document.getElementById('historyView');

  function formatHistoryDate(iso) {
    try {
      return new Date(iso).toLocaleString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (e) {
      return iso;
    }
  }

  finalizeBtn.addEventListener('click', function () {
    var total = grandTotal();
    var ok = window.confirm(
      'Guardar esta compra no histórico de hoje?\n\n' +
      'Salva os itens, quantidades e valores de agora (total ' + formatBRL(total) + ') como uma compra concluída. ' +
      'A lista atual continua exatamente como está — nada é zerado.'
    );
    if (!ok) return;

    var snapshot = {
      purchased_at: new Date().toISOString(),
      budget: Number(state.budget) || 0,
      total_spent: total,
      items: state.itemsByCategory
    };

    if (!supabase) {
      queueHistorySnapshot(snapshot);
      window.alert('Sem internet agora — a compra ficou guardada no aparelho e envia sozinha assim que a conexão voltar.');
      return;
    }

    supabase.from('mercado_history').insert(snapshot).then(function (res) {
      if (res.error) {
        queueHistorySnapshot(snapshot);
      }
    }).catch(function () {
      queueHistorySnapshot(snapshot);
    });
  });

  function openHistory() {
    if (planningDraft) closePlanning();
    shoppingViewEl.style.display = 'none';
    historyViewEl.style.display = '';
    renderHistoryView();
  }

  function closeHistory() {
    historyViewEl.style.display = 'none';
    shoppingViewEl.style.display = '';
  }

  async function renderHistoryView() {
    historyViewEl.innerHTML = '';

    var header = document.createElement('div');
    header.className = 'planning-header';
    header.innerHTML = '<div><p class="eyebrow">Balanço</p><h2>Histórico de compras</h2></div>';
    historyViewEl.appendChild(header);

    var backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'history-back';
    backBtn.textContent = '← Voltar às compras';
    backBtn.addEventListener('click', closeHistory);
    historyViewEl.appendChild(backBtn);

    if (!supabase) {
      var offlineMsg = document.createElement('div');
      offlineMsg.className = 'empty-state';
      offlineMsg.textContent = 'Sem conexão agora — o histórico precisa de internet pra carregar.';
      historyViewEl.appendChild(offlineMsg);
      return;
    }

    var loading = document.createElement('div');
    loading.className = 'empty-state';
    loading.textContent = 'Carregando…';
    historyViewEl.appendChild(loading);

    var res;
    try {
      res = await supabase.from('mercado_history').select('*').order('purchased_at', { ascending: false }).limit(50);
    } catch (e) {
      loading.textContent = 'Não deu pra carregar o histórico agora.';
      return;
    }
    if (res.error) {
      loading.textContent = 'Não deu pra carregar o histórico agora.';
      return;
    }

    loading.remove();

    var rows = res.data || [];
    if (!rows.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nenhuma compra finalizada ainda. Use "Finalizar compra" ao terminar uma compra pra ela aparecer aqui.';
      historyViewEl.appendChild(empty);
      return;
    }

    rows.forEach(function (row) {
      var entry = document.createElement('details');
      entry.className = 'history-entry';

      var summary = document.createElement('summary');
      summary.innerHTML =
        '<span class="date">' + formatHistoryDate(row.purchased_at) +
        '<span class="budget-note">Saldo definido: ' + formatBRL(Number(row.budget) || 0) + '</span></span>' +
        '<span class="total">' + formatBRL(Number(row.total_spent) || 0) + '</span>';
      entry.appendChild(summary);

      var body = document.createElement('div');
      body.className = 'history-body';
      var itemsByCat = normalizeItems(row.items);
      CATEGORIES.forEach(function (cat) {
        var items = (itemsByCat[cat] || []).filter(function (item) { return item.included !== false; });
        if (!items.length) return;
        var catEl = document.createElement('div');
        catEl.className = 'history-cat';
        catEl.innerHTML = '<div class="name">' + escapeHtml(cat) + '</div>';
        items.forEach(function (item) {
          var lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
          var rowEl = document.createElement('div');
          rowEl.className = 'history-item-row';
          rowEl.innerHTML =
            '<span>' + escapeHtml(item.name || '') + '<span class="qty">×' + (Number(item.qty) || 0) + '</span></span>' +
            '<span class="price">' + formatBRL(lineTotal) + '</span>';
          catEl.appendChild(rowEl);
        });
        body.appendChild(catEl);
      });
      entry.appendChild(body);

      historyViewEl.appendChild(entry);
    });
  }

  historyBtn.addEventListener('click', openHistory);

  function updatePlanningCounter() {
    var n = 0;
    CATEGORIES.forEach(function (cat) {
      planningDraft[cat].forEach(function (item) { if (item.included) n++; });
    });
    var el = document.getElementById('planningCounter');
    if (el) el.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  }

  function renderPlanningView() {
    planningViewEl.innerHTML = '';

    var header = document.createElement('div');
    header.className = 'planning-header';
    header.innerHTML =
      '<div><p class="eyebrow">Antes de ir às compras</p><h2>O que vai nessa lista?</h2></div>' +
      '<span class="planning-counter" id="planningCounter"></span>';
    planningViewEl.appendChild(header);

    CATEGORIES.forEach(function (cat) {
      var section = document.createElement('div');
      section.className = 'plan-category';

      var head = document.createElement('div');
      head.className = 'plan-category-head';
      head.innerHTML =
        '<span class="name">' + escapeHtml(cat) + '</span>' +
        '<span class="bulk-actions">' +
          '<button type="button" class="mark-all">marcar todos</button>' +
          '<button type="button" class="unmark-all">desmarcar todos</button>' +
        '</span>';
      section.appendChild(head);

      var list = document.createElement('div');
      list.className = 'plan-list';

      planningDraft[cat].forEach(function (item, idx) {
        var row = document.createElement('label');
        row.className = 'plan-row';
        row.innerHTML =
          '<input type="checkbox"' + (item.included ? ' checked' : '') + '>' +
          '<span>' + escapeHtml(item.name || '(sem nome)') + '</span>';
        row.querySelector('input').addEventListener('change', function (e) {
          planningDraft[cat][idx].included = e.target.checked;
          updatePlanningCounter();
        });
        list.appendChild(row);
      });

      var addRow = document.createElement('div');
      addRow.className = 'plan-add-row';
      addRow.innerHTML = '<input type="text" placeholder="Adicionar item novo..."><button type="button">+ adicionar</button>';
      var addInput = addRow.querySelector('input');
      var addBtnEl = addRow.querySelector('button');
      function addNewPlanItem() {
        var name = addInput.value.trim();
        if (!name) return;
        planningDraft[cat].push({ name: name, qty: 1, price: 0, included: true });
        renderPlanningView();
      }
      addBtnEl.addEventListener('click', addNewPlanItem);
      addInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); addNewPlanItem(); }
      });
      list.appendChild(addRow);

      section.appendChild(list);

      head.querySelector('.mark-all').addEventListener('click', function () {
        planningDraft[cat].forEach(function (item) { item.included = true; });
        renderPlanningView();
      });
      head.querySelector('.unmark-all').addEventListener('click', function () {
        planningDraft[cat].forEach(function (item) { item.included = false; });
        renderPlanningView();
      });

      planningViewEl.appendChild(section);
    });

    var footer = document.createElement('div');
    footer.className = 'planning-footer';
    footer.innerHTML =
      '<button type="button" class="cancel-plan">Cancelar</button>' +
      '<button type="button" class="go-shopping">Ir às compras</button>';
    footer.querySelector('.cancel-plan').addEventListener('click', closePlanning);
    footer.querySelector('.go-shopping').addEventListener('click', confirmPlanning);
    planningViewEl.appendChild(footer);

    updatePlanningCounter();
  }

  function confirmPlanning() {
    CATEGORIES.forEach(function (cat) { sortItems(planningDraft[cat]); });
    state.itemsByCategory = planningDraft;
    planningDraft = null;
    planningViewEl.style.display = 'none';
    shoppingViewEl.style.display = '';
    persist();
    render();
  }

  planBtn.addEventListener('click', openPlanning);

  function applyRemote(row) {
    var normalized = normalizeItems(row.items);
    var incomingJson = JSON.stringify({ budget: Number(row.budget) || 0, items: normalized });
    if (incomingJson === lastSentJson) return; // eco do próprio salvamento
    state.budget = row.budget;
    state.itemsByCategory = normalized;
    lastSentJson = incomingJson;
    render();
  }

  function connectRealtime() {
    if (!supabase || realtimeConnected) return;
    realtimeConnected = true;
    supabase
      .channel('mercado_state_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mercado_state', filter: 'id=eq.' + ROW_ID }, function (payload) {
        if (payload.new) applyRemote(payload.new);
      })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          setSync('live', 'sincronizado');
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          realtimeConnected = false;
          setSync('saving', 'offline — editando localmente');
        }
      });
  }

  async function init() {
    // Mostra o que já está salvo no aparelho na hora, antes mesmo de tentar a rede —
    // assim o app abre instantaneamente e continua usável se estiver offline.
    var cached = loadLocalCache();
    if (cached) {
      state.budget = cached.budget;
      state.itemsByCategory = cached.itemsByCategory;
      render();
    }

    if (!supabase) {
      setSync('saving', cached ? 'offline — editando localmente' : 'sem conexão');
      if (!cached) render();
      ensureReconnectWatch();
      return;
    }

    setSync('saving', 'carregando…');
    var res;
    try {
      res = await supabase.from('mercado_state').select('*').eq('id', ROW_ID).maybeSingle();
    } catch (networkError) {
      setSync('saving', cached ? 'offline — editando localmente' : 'sem conexão');
      if (!cached) render();
      return;
    }
    if (res.error) {
      setSync('saving', cached ? 'offline — editando localmente' : 'sem conexão');
      if (!cached) render();
      return;
    }
    if (res.data) {
      state.budget = res.data.budget;
      var hasAny = res.data.items && (Array.isArray(res.data.items) ? res.data.items.length : Object.keys(res.data.items).length);
      state.itemsByCategory = hasAny ? normalizeItems(res.data.items) : defaultItemsByCategory();
      lastSentJson = JSON.stringify({ budget: Number(state.budget) || 0, items: state.itemsByCategory });
      // Se os dados vieram no formato antigo, já regrava no novo formato.
      if (Array.isArray(res.data.items)) {
        await supabase.from('mercado_state').upsert({ id: ROW_ID, budget: state.budget, items: state.itemsByCategory });
      }
    } else {
      await supabase.from('mercado_state').upsert({ id: ROW_ID, budget: 0, items: state.itemsByCategory });
    }
    saveLocalCache();
    render();
    setSync('live', 'sincronizado');
    connectRealtime();
  }

  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* segue sem cache offline */ });
    });
  }
})();
