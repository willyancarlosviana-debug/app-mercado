<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Mercado</title>
<meta name="theme-color" content="#4A7C59">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --ground: #FBF8F2;
    --surface: #FFFFFF;
    --surface-2: #F3EEE2;
    --line: #E4DCC9;
    --ink: #2B2621;
    --ink-soft: #6B6255;
    --accent: #4A7C59;
    --accent-soft: #E4EFE3;
    --warn: #B84A3E;
    --warn-soft: #F7E4E0;
    --shadow: 0 1px 2px rgba(43,38,33,0.06), 0 6px 20px rgba(43,38,33,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1B1814;
      --surface: #242019;
      --surface-2: #2C2720;
      --line: #3B342A;
      --ink: #EDE6D8;
      --ink-soft: #A79C89;
      --accent: #7FB58C;
      --accent-soft: #26332A;
      --warn: #E08175;
      --warn-soft: #3A2521;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #1B1814;
    --surface: #242019;
    --surface-2: #2C2720;
    --line: #3B342A;
    --ink: #EDE6D8;
    --ink-soft: #A79C89;
    --accent: #7FB58C;
    --accent-soft: #26332A;
    --warn: #E08175;
    --warn-soft: #3A2521;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 0.35rem;
  }
  h1 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 1.75rem;
    text-wrap: balance;
  }

  .sync-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    white-space: nowrap;
    margin-top: 0.15rem;
  }
  .sync-indicator .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: background 0.2s ease;
  }
  .sync-indicator.live .dot { background: var(--accent); }
  .sync-indicator.saving .dot { background: #C9962B; }
  .sync-indicator.off .dot { background: var(--warn); }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .theme-toggle {
    width: 2rem;
    height: 2rem;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 16px; height: 16px; }

  /* Budget panel */
  .budget-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 480px) {
    .budget-panel { grid-template-columns: 1fr; }
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .money-input {
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    border-bottom: 2px solid var(--line);
    padding-bottom: 0.3rem;
    transition: border-color 0.15s ease;
  }
  .money-input:focus-within { border-color: var(--accent); }
  .money-input span {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 1.1rem;
  }
  .money-input input {
    border: none;
    background: transparent;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink);
    width: 100%;
    min-width: 0;
  }
  .balance-value {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    font-weight: 600;
    padding-bottom: 0.3rem;
    border-bottom: 2px solid transparent;
  }
  .balance-value.ok { color: var(--accent); }
  .balance-value.over { color: var(--warn); }

  /* Status strip */
  .status-strip {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 1.25rem;
    padding: 0 0.1rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
  }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }
  .pill.over { background: var(--warn-soft); color: var(--warn); }
  .pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-strip .bar {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .status-strip .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .status-strip .bar-fill.over { background: var(--warn); }

  /* Category tabs */
  .category-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.9rem;
  }
  .category-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.2rem;
    padding: 0.65rem 0.85rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: left;
    min-width: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .category-tab:hover { border-color: var(--accent); }
  .category-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .category-tab .tab-name {
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .category-tab .tab-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  .category-tab.active .tab-sub { color: var(--accent); }

  @media (max-width: 520px) {
    .category-tab .tab-name { font-size: 0.74rem; }
    .category-tab .tab-sub { font-size: 0.66rem; }
  }

  /* List */
  .list-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .list-head {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: var(--surface-2);
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .list-head .num { text-align: right; }
  #rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    gap: 0.5rem;
    align-items: center;
    padding: 0.6rem 1rem;
    border-top: 1px solid var(--line);
  }
  .row input[type="text"] {
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    padding: 0.3rem 0;
    min-width: 0;
  }
  .row input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.6; }
  .row input[type="number"] {
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    outline: none;
    padding: 0.25rem 0.1rem;
    width: 100%;
    text-align: right;
    min-width: 0;
  }
  .row input[type="number"]:focus { border-color: var(--accent); }
  .row .line-total {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.92rem;
    font-weight: 600;
    text-align: right;
  }
  .row .remove {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0.2rem;
    border-radius: 6px;
    justify-self: end;
  }
  .row .remove:hover { color: var(--warn); background: var(--warn-soft); }

  .empty-state {
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    border-top: 1px solid var(--line);
  }

  .add-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .add-row button {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px dashed var(--line);
    background: var(--surface);
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .add-row button:hover { border-color: var(--accent); background: var(--accent-soft); }

  .list-foot {
    display: grid;
    grid-template-columns: 1fr 4.2rem 5.5rem 5.8rem 2rem;
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }
  .list-foot .label {
    grid-column: 1 / 4;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .list-foot .total {
    text-align: right;
    font-weight: 700;
    font-size: 1rem;
  }

  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .hint {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: center;
  }

  .site-footer {
    margin-top: 2.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }

  @media (max-width: 560px) {
    .list-head, .row, .list-foot {
      grid-template-columns: 1fr 3.4rem 4.6rem 4.8rem 1.6rem;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="top-row">
    <div>
      <p class="eyebrow">Controle de compras</p>
      <h1>Lista de Mercado</h1>
    </div>
    <div class="top-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema"></button>
      <span class="sync-indicator off" id="syncIndicator"><span class="dot"></span><span id="syncLabel">conectando…</span></span>
    </div>
  </div>

  <div class="budget-panel">
    <div class="field">
      <label for="budget">Saldo para compra</label>
      <div class="money-input">
        <span>R$</span>
        <input type="number" id="budget" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
      </div>
    </div>
    <div class="field">
      <label>Saldo restante</label>
      <div class="balance-value ok" id="balanceValue">R$ 0,00</div>
    </div>
  </div>

  <div class="status-strip">
    <span class="pill ok" id="statusPill">dentro do saldo</span>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <span id="statusPct">0%</span>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="list-card">
    <div class="list-head">
      <span>Item</span>
      <span class="num">Qtd.</span>
      <span class="num">Unit.</span>
      <span class="num">Total</span>
      <span></span>
    </div>
    <div id="rows"></div>
    <div class="add-row">
      <button id="addBtn" type="button">+ adicionar item</button>
    </div>
    <div class="list-foot">
      <span class="label" id="footLabel">Subtotal nesta aba</span>
      <span class="total" id="cartTotal">R$ 0,00</span>
      <span></span>
    </div>
  </div>

  <p class="site-footer">© <span id="footerYear"></span> Willyan Viana</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://rheujziajqjcezvvpfno.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_YSFqv-uAUtarAb1RUzLYBw_ftTjVxfG';
  var ROW_ID = 'default';
  var CATEGORIES = ['Frutas e Verduras', 'Carnes', 'Limpeza', 'Cereais e Mercearia'];

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var rowsEl = document.getElementById('rows');
  var budgetInput = document.getElementById('budget');
  var balanceValue = document.getElementById('balanceValue');
  var cartTotal = document.getElementById('cartTotal');
  var footLabel = document.getElementById('footLabel');
  var statusPill = document.getElementById('statusPill');
  var statusPct = document.getElementById('statusPct');
  var barFill = document.getElementById('barFill');
  var addBtn = document.getElementById('addBtn');
  var syncIndicator = document.getElementById('syncIndicator');
  var syncLabel = document.getElementById('syncLabel');
  var categoryTabsEl = document.getElementById('categoryTabs');
  var themeToggle = document.getElementById('themeToggle');

  var THEME_KEY = 'lista-mercado-theme';
  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function effectiveTheme() {
    var explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function refreshThemeIcon() {
    // O ícone mostra o tema para o qual o clique vai mudar.
    themeToggle.innerHTML = effectiveTheme() === 'dark' ? SUN_ICON : MOON_ICON;
  }

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    refreshThemeIcon();
  }

  (function initTheme() {
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(stored);
  })();

  themeToggle.addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  var footerYearEl = document.getElementById('footerYear');
  if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();

  function mkItems(names) {
    return names.map(function (name) { return { name: name, qty: 1, price: 0 }; });
  }

  function defaultItemsByCategory() {
    return {
      'Frutas e Verduras': mkItems(['Cebola', 'Alho', 'Milho', 'Maçã', 'Banana']),
      'Carnes': mkItems(['Salsicha', 'Frango', 'Sardinha']),
      'Limpeza': mkItems([
        'Sabão em pó', 'Sabão', 'Pinho Sol', 'Amaciante', 'Absorvente', 'Sabonetes',
        'Pasta de dente', 'Papel higiênico', 'Papel toalha', 'Desodorante gel',
        'Sabonete/sabão umedecidos', 'Bom Bril', 'Pano de pia'
      ]),
      'Cereais e Mercearia': mkItems([
        'Farinha', 'Feijão', 'Açúcar', 'Café', 'Leite - fardos', 'Leite condensado',
        'Creme de leite', 'Biscoitos', 'Iogurtes', 'Extrato de tomate', 'Macarrão/Massa',
        'Margarina', 'Fermento pão', 'Requeijão', 'Óleo', 'Refil coador'
      ])
    };
  }

  var state = { budget: 0, itemsByCategory: defaultItemsByCategory() };
  var activeCategory = CATEGORIES[0];
  var lastSentJson = null;
  var saveTimer = null;

  function setSync(mode, label) {
    syncIndicator.className = 'sync-indicator ' + mode;
    syncLabel.textContent = label;
  }

  function formatBRL(n) {
    if (!isFinite(n)) n = 0;
    return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Garante que todas as categorias existam, mesmo em dados antigos/incompletos.
  function normalizeItems(raw) {
    var result = {};
    CATEGORIES.forEach(function (cat) {
      if (raw && Array.isArray(raw[cat])) {
        result[cat] = raw[cat];
      } else {
        result[cat] = [];
      }
    });
    // Formato antigo (lista única, sem categorias, ou categoria "Cereais" renomeada): joga tudo em Cereais e Mercearia.
    if (raw && Array.isArray(raw) && raw.length) {
      result['Cereais e Mercearia'] = result['Cereais e Mercearia'].concat(raw);
    }
    if (raw && Array.isArray(raw['Cereais']) && raw['Cereais'].length) {
      result['Cereais e Mercearia'] = result['Cereais e Mercearia'].concat(raw['Cereais']);
    }
    return result;
  }

  function categoryTotal(cat) {
    var items = state.itemsByCategory[cat] || [];
    return items.reduce(function (sum, item) {
      return sum + (Number(item.qty) || 0) * (Number(item.price) || 0);
    }, 0);
  }

  function grandTotal() {
    return CATEGORIES.reduce(function (sum, cat) { return sum + categoryTotal(cat); }, 0);
  }

  function renderTabs() {
    categoryTabsEl.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-tab' + (cat === activeCategory ? ' active' : '');
      btn.innerHTML =
        '<span class="tab-name">' + escapeHtml(cat) + '</span>' +
        '<span class="tab-sub">' + formatBRL(categoryTotal(cat)) + '</span>';
      btn.addEventListener('click', function () {
        activeCategory = cat;
        render();
      });
      categoryTabsEl.appendChild(btn);
    });
  }

  function render() {
    renderTabs();

    if (document.activeElement !== budgetInput) {
      budgetInput.value = state.budget ? state.budget : '';
    }
    rowsEl.innerHTML = '';

    var items = state.itemsByCategory[activeCategory] || [];

    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nenhum item em "' + activeCategory + '" ainda.';
      rowsEl.appendChild(empty);
    }

    items.forEach(function (item, idx) {
      var row = document.createElement('div');
      row.className = 'row';
      var lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
      row.innerHTML =
        '<input type="text" class="name-input" placeholder="Nome do item" value="' + escapeHtml(item.name || '') + '">' +
        '<input type="number" class="qty-input" min="0" step="1" inputmode="numeric" value="' + (item.qty !== '' && item.qty !== undefined ? item.qty : '') + '">' +
        '<input type="number" class="price-input" min="0" step="0.01" inputmode="decimal" value="' + (item.price !== '' && item.price !== undefined ? item.price : '') + '">' +
        '<span class="line-total">' + formatBRL(lineTotal) + '</span>' +
        '<button type="button" class="remove" aria-label="Remover item" title="Remover item">×</button>';

      row.querySelector('.name-input').addEventListener('input', function (e) {
        items[idx].name = e.target.value;
        scheduleSave();
      });
      row.querySelector('.qty-input').addEventListener('input', function (e) {
        items[idx].qty = e.target.value;
        scheduleSave();
        renderTotalsOnly();
      });
      row.querySelector('.price-input').addEventListener('input', function (e) {
        items[idx].price = e.target.value;
        scheduleSave();
        renderTotalsOnly();
      });
      row.querySelector('.remove').addEventListener('click', function () {
        items.splice(idx, 1);
        scheduleSave();
        render();
      });

      rowsEl.appendChild(row);
    });

    updateTotals();
  }

  // Recalcula só os totais/rótulos sem recriar os inputs, para não perder o foco ao digitar.
  function renderTotalsOnly() {
    var items = state.itemsByCategory[activeCategory] || [];
    var rowEls = rowsEl.querySelectorAll('.row');
    items.forEach(function (item, idx) {
      var lineTotal = (Number(item.qty) || 0) * (Number(item.price) || 0);
      var totalEl = rowEls[idx] && rowEls[idx].querySelector('.line-total');
      if (totalEl) totalEl.textContent = formatBRL(lineTotal);
    });
    renderTabs();
    updateTotals();
  }

  function updateTotals() {
    var subtotal = categoryTotal(activeCategory);
    var total = grandTotal();

    footLabel.textContent = 'Subtotal — ' + activeCategory;
    cartTotal.textContent = formatBRL(subtotal);

    var budget = Number(state.budget) || 0;
    var remaining = budget - total;
    var over = remaining < 0;

    balanceValue.textContent = formatBRL(remaining);
    balanceValue.className = 'balance-value ' + (over ? 'over' : 'ok');

    statusPill.className = 'pill ' + (over ? 'over' : 'ok');
    statusPill.textContent = over ? 'saldo estourado' : 'dentro do saldo';

    var pct = budget > 0 ? Math.min(100, (total / budget) * 100) : (total > 0 ? 100 : 0);
    barFill.style.width = pct + '%';
    barFill.className = 'bar-fill' + (over ? ' over' : '');
    statusPct.textContent = Math.round(budget > 0 ? (total / budget) * 100 : 0) + '%';
  }

  function scheduleSave() {
    setSync('saving', 'salvando…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 450);
  }

  function persist() {
    var payload = {
      id: ROW_ID,
      budget: Number(state.budget) || 0,
      items: state.itemsByCategory,
      updated_at: new Date().toISOString()
    };
    lastSentJson = JSON.stringify({ budget: payload.budget, items: payload.items });
    supabase.from('mercado_state').upsert(payload).then(function (res) {
      if (res.error) {
        setSync('off', 'erro ao salvar');
      } else {
        setSync('live', 'sincronizado');
      }
    });
  }

  budgetInput.addEventListener('input', function (e) {
    state.budget = e.target.value;
    scheduleSave();
    updateTotals();
  });

  addBtn.addEventListener('click', function () {
    state.itemsByCategory[activeCategory].push({ name: '', qty: 1, price: 0 });
    scheduleSave();
    render();
    var inputs = rowsEl.querySelectorAll('.name-input');
    var last = inputs[inputs.length - 1];
    if (last) last.focus();
  });

  function applyRemote(row) {
    var normalized = normalizeItems(row.items);
    var incomingJson = JSON.stringify({ budget: Number(row.budget) || 0, items: normalized });
    if (incomingJson === lastSentJson) return; // eco do próprio salvamento
    state.budget = row.budget;
    state.itemsByCategory = normalized;
    lastSentJson = incomingJson;
    render();
  }

  async function init() {
    setSync('saving', 'carregando…');
    var res = await supabase.from('mercado_state').select('*').eq('id', ROW_ID).maybeSingle();
    if (res.error) {
      setSync('off', 'offline');
      render();
      return;
    }
    if (res.data) {
      state.budget = res.data.budget;
      var hasAny = res.data.items && (Array.isArray(res.data.items) ? res.data.items.length : Object.keys(res.data.items).length);
      state.itemsByCategory = hasAny ? normalizeItems(res.data.items) : defaultItemsByCategory();
      lastSentJson = JSON.stringify({ budget: Number(state.budget) || 0, items: state.itemsByCategory });
      // Se os dados vieram no formato antigo, já regrava no novo formato.
      if (Array.isArray(res.data.items)) {
        await supabase.from('mercado_state').upsert({ id: ROW_ID, budget: state.budget, items: state.itemsByCategory });
      }
    } else {
      await supabase.from('mercado_state').upsert({ id: ROW_ID, budget: 0, items: state.itemsByCategory });
    }
    render();
    setSync('live', 'sincronizado');

    supabase
      .channel('mercado_state_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mercado_state', filter: 'id=eq.' + ROW_ID }, function (payload) {
        if (payload.new) applyRemote(payload.new);
      })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') setSync('live', 'sincronizado');
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSync('off', 'offline');
      });
  }

  init();
})();

// PWA: gera ícone e manifest em tempo de execução para permitir "Adicionar à tela inicial"
(function setupInstallable() {
  function drawIcon(size) {
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var r = size * 0.22;
    ctx.fillStyle = '#4A7C59';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#FBF8F2';
    ctx.fillStyle = '#FBF8F2';
    ctx.lineWidth = size * 0.045;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var s = size;
    ctx.beginPath();
    ctx.moveTo(s * 0.20, s * 0.28);
    ctx.lineTo(s * 0.30, s * 0.28);
    ctx.lineTo(s * 0.40, s * 0.62);
    ctx.lineTo(s * 0.76, s * 0.62);
    ctx.lineTo(s * 0.84, s * 0.38);
    ctx.lineTo(s * 0.34, s * 0.38);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(s * 0.45, s * 0.74, s * 0.045, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.72, s * 0.74, s * 0.045, 0, Math.PI * 2);
    ctx.fill();

    return canvas.toDataURL('image/png');
  }

  try {
    var icon192 = drawIcon(192);
    var icon512 = drawIcon(512);

    var appleTouch = document.createElement('link');
    appleTouch.rel = 'apple-touch-icon';
    appleTouch.href = icon192;
    document.head.appendChild(appleTouch);

    var favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.href = icon192;
    document.head.appendChild(favicon);

    var manifest = {
      name: 'Lista de Mercado',
      short_name: 'Mercado',
      start_url: '.',
      scope: '.',
      display: 'standalone',
      background_color: '#FBF8F2',
      theme_color: '#4A7C59',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var manifestUrl = URL.createObjectURL(blob);

    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);
  } catch (e) { /* instalação como app é um extra; a lista funciona normalmente sem isso */ }
})();
</script>
